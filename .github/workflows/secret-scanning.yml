name: Secret Scanning – Gitleaks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 5 * * 1"   # elke maandag om 05:00 UTC

jobs:
  secret-scanning:
    name: Detect secrets with Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volledige git history voor betere detectie

      - name: Run Gitleaks secret scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Block pipeline if secrets detected
        if: failure() || steps.gitleaks.outcome == 'failure'
        run: |
          echo "=========================================="
          echo " SECRET SCANNING RESULT"
          echo "=========================================="
          echo "Pipeline BLOCKED: secrets detected in repository!"
          echo " Review the Gitleaks output above for details."
          echo "=========================================="
          exit 1

      - name: Confirm no secrets found
        if: success()
        run: |
          echo "=========================================="
          echo " SECRET SCANNING RESULT"
          echo "=========================================="
          echo "No secrets detected. Pipeline passed."
          echo "=========================================="
